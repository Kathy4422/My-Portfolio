<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Design</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            background: #0b0b14;
            cursor: crosshair;
            color: white;
        }

        /* MAIN CONTAINER */

        .container{
            width: 90%;
            margin: 40px auto;
            min-height: 100vh;

            border-radius: 30px;

            /* GRID BACKGROUND */
            background-color: black;

            background-image:
            linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);

            background-size: 40px 40px;

            padding-bottom: 100px;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn{
    from{
        opacity: 0;
        transform: translateY(30px);
    }

    to{
        opacity: 1;
        transform: translateY(0);
    }
}
        

        /* NAVBAR */

        nav{
            width: 85%;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 30px;

            background: #050505;

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 18px;

            position: relative;
            top: 30px;
        }

        /* LOGO */

        .logo{
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .circle{
            width: 45px;
            height: 45px;
            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.2);

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;
        }

        .logo h2{
            font-size: 20px;
        }

        /* NAV LINKS */

        .nav-links{
            display: flex;
            gap: 50px;
        }

        .nav-links a{
            text-decoration: none;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover{
            color: #999;
        }

        /* ACTIVE BUTTON */

        .active{
            background: #161616;
            padding: 12px 22px;
            border-radius: 10px;
        }

        /* CONTACT BUTTON */

        .contact-btn{
            background: white;
            color: black;
            padding: 14px 28px;
            border-radius: 10px;
            border: none;

            font-weight: 600;
            cursor: pointer;
             transition: 0.3s;
        }
          .contact-btn:hover{
            transform: scale(1.05);
        }

        /* HERO SECTION */

        .hero{
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-top: 90px;
            text-align: center;
        }

        /* IMAGE */

        .hero img{
            width: 420px;
            height: 520px;

            object-fit: cover;

            border-radius: 250px 250px 0 0;

            border: 5px solid white;
             transition: 0.4s;
        }
        .hero img:hover{
    transform: scale(1.03);
        }

        /* TEXT */

        .hero h1{
            font-size: 65px;
            line-height: 1.1;

            margin-top: 30px;
        }

        .hero p{
            margin-top: 20px;
            color: #9e9e9e;
            font-size: 18px;
        }

        /* BUTTON */

        .hero button{
            margin-top: 30px;

            padding: 15px 35px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-weight: 600;
            cursor: pointer;

            transition: 0.3s;
        }

        .hero button:hover{
            transform: scale(1.05);
        }

        /* RESPONSIVE DESIGN */

        @media(max-width: 900px){

            nav{
                flex-direction: column;
                gap: 20px;
            }

            .nav-links{
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1{
                font-size: 40px;
            }

            .hero img{
                width: 300px;
                height: 400px;
            }

        }
        .social-icons {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 20px;
    font-size: 22px;
}

.social-icons i {
    cursor: pointer;
    transition: 0.3s;
}

.social-icons i:hover {
    transform: scale(1.2);
    color: #999;
}
.hire-btn{
    display: inline-block;

    margin-top: 30px;
    padding: 15px 35px;

    background: white;
    color: black;

    text-decoration: none;
    border-radius: 10px;

    font-weight: 600;
    cursor: pointer;

    transition: 0.3s;
}

.hire-btn:hover{
    transform: scale(1.05);
}

    </style>

</head>
<body>

    <div class="container">

        <!-- NAVBAR -->

        <nav>

            <!-- LOGO -->

            <div class="logo">

                <div class="circle">
                    K
                </div>

                  <h2>Kate</h2>

            </div>

            <!-- LINKS -->

            <!-- <div class="nav-links">

                <a class="active" href="">Home</a>
                <a href="">About</a>
                <a href="">Services</a>
                <a href="">Projects</a>

            </div> -->
             <div class="nav-links">
        <!-- <div><a href="index.html"><b>Home</b></a></div> -->
       <div> <a href="summary.html"><b>Summary</b></a> </div>
        <div><a href="technical.html"><b>Technical Skills</b></a></div>
        <div><a href="experience.html"><b>Experience</b></a></div>
        <div><a href="projects.html"><b>Projects</b></a></div>
        <div><a href="education.html"><b>Education</b></a></div>
    </div>

            <!-- BUTTON -->

            <button class="contact-btn">
                Contact
            </button>

        </nav>

        <!-- HERO SECTION -->

        <section class="hero">

            <!-- YOUR IMAGE -->

            <img src="a-woman-in-a-business-suit-looking-at-the-camera-photo.jpeg" alt="Profile Image">

            <!-- TEXT -->

            <h1>
                 Hi, I’m Kate — A Web Developer <br>
                I create stunning websites and applications.
            </h1>

            <p>
                Transforming ideas into elegant and functional digital experiences.
            </p>

            <!-- BUTTON -->

            <!-- HERO BUTTON -->
<a class="hire-btn" href="hireme.html">
    Hire Me
</a>
            <footer>
    <p>© 2026 Kate Portfolio</p>
</footer>
        
<!-- SOCIAL ICONS BELOW FOOTER -->
<div class="social-icons">
    <i class="fa-brands fa-github"></i>
    <i class="fa-brands fa-linkedin"></i>
    <i class="fa-brands fa-instagram"></i>
</div>

        </section>

    </div>

</body>
</html>
