
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>

        /* Remove default spacing */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page styling */
       body{
    font-family: Arial, sans-serif;
   background-color: #edf2f7;
    padding-top: 100px;
    padding-left: 40px;
    padding-right: 40px;
}

        /* Main container */
        .container{
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 50px;
        }

        /* LEFT SIDE IMAGES */
        .image-section{
            width: 40%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Image styling */
        .image-section img{
            width: 100%;
            border-radius: 15px;
        }

        /* RIGHT SIDE TEXT */
        .text-section{
            width: 60%;
             margin-top: 80px;
        }

        /* Headings */
        .text-section h1{
            font-size: 50px;
            margin-bottom: 20px;
            color: #222;
        }

        .text-section h2{
            margin-top: 25px;
            margin-bottom: 10px;
            color: #444;
        }

        /* Paragraphs */
        .text-section p{
            font-size: 18px;
            line-height: 1.8;
            color: #555;
        }

        /* Button */
        button{
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            background-color: black;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover{
            background-color: #444;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE IMAGES -->
        <div class="image-section">

            <img src="christopher-gower-m_HRfLhgABo-unsplash.jpg" alt="My Picture">
            <!-- <img src="austin-poon-JO_S6ewBqAk-unsplash.jpg" alt="Project Image">
            <img src="image3.jpg" alt="Another Image"> -->

        </div>

        <!-- RIGHT SIDE TEXT -->
        <div class="text-section">

            <h1>Hello, I'm Kate</h1>

            <p>
                I am a web designer and developer passionate about
                creating beautiful and responsive websites.
            </p>

            <h2>About Me</h2>

            <p>
                I enjoy designing modern websites using HTML and CSS.
                I also love learning Flutter app development.
            </p>

            <button>Contact Me</button>

        </div>

    </div>

</body>
</html>
